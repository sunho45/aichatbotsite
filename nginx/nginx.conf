# Nginx 워커 프로세스 수를 설정합니다. `auto`는 CPU 코어 수에 맞춰 자동으로 결정합니다.
worker_processes auto;

events {
    # 각 워커 프로세스가 동시에 처리할 수 있는 최대 연결 수입니다.
    worker_connections 1024;
}

http {
    # 파일 확장자에 맞는 MIME 타입을 불러와 올바른 Content-Type으로 응답하게 합니다.
    include       mime.types;
    # MIME 타입을 찾지 못했을 때 사용할 기본 타입입니다.
    default_type  application/octet-stream;

    # 정적 파일 전송 성능을 높이기 위해 sendfile 기능을 활성화합니다.
    sendfile on;
    # 클라이언트 연결을 65초 동안 유지해 재사용할 수 있게 합니다.
    keepalive_timeout 65;

    # `upstream`은 Nginx 공식 지시어이고, `app_server`는 사용자가 정한 업스트림 그룹 이름입니다.
    # 프록시 요청을 전달할 백엔드 애플리케이션 서버 그룹을 정의합니다.
    upstream app_server {
        # 로컬에서 8000번 포트로 실행 중인 애플리케이션 서버입니다.
        server 127.0.0.1:8000;
    }

    server {
        # IPv4의 일반 HTTP(80번 포트) 요청을 받습니다.
        listen 80;
        # IPv6의 일반 HTTP(80번 포트) 요청을 받습니다.
        listen [::]:80;
        # 이 서버 블록이 처리할 도메인 이름입니다.
        server_name example.com www.example.com;

        # `return`은 공식 지시어입니다.
        # `$host`, `$request_uri`는 Nginx가 제공하는 실제 내장 변수입니다.
        # 모든 HTTP 요청을 동일한 HTTPS 주소로 영구 리다이렉트합니다.
        return 301 https://$host$request_uri;
    }

    server {
        # IPv4의 HTTPS(443번 포트) 요청을 받고 HTTP/2를 활성화합니다.
        listen 443 ssl http2;
        # IPv6의 HTTPS(443번 포트) 요청을 받고 HTTP/2를 활성화합니다.
        listen [::]:443 ssl http2;
        # HTTPS로 들어오는 해당 도메인 요청을 처리합니다.
        server_name example.com www.example.com;

        # Let's Encrypt에서 발급한 전체 인증서 체인 파일 경로입니다.
        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        # 인증서와 짝을 이루는 개인 키 파일 경로입니다.
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
        # TLS 세션 유지 시간과 캐시 설정으로 재연결 성능과 보안을 조정합니다.
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # 보안상 비교적 안전한 최신 TLS 버전만 허용합니다.
        ssl_protocols TLSv1.2 TLSv1.3;
        # 최신 클라이언트가 적절한 암호군을 선택하도록 서버 우선순위를 강제하지 않습니다.
        ssl_prefer_server_ciphers off;

        # 브라우저에 이 도메인을 1년 동안 HTTPS로만 접속하도록 지시합니다.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            # `proxy_pass`는 공식 지시어이고, `app_server`는 위에서 정의한 사용자 지정 이름입니다.
            # 들어온 모든 요청을 백엔드 애플리케이션 서버로 전달합니다.
            proxy_pass http://app_server;
            # WebSocket 같은 업그레이드 연결을 위해 HTTP/1.1로 프록시합니다.
            proxy_http_version 1.1;
            # `$host`는 Nginx 내장 변수로, 클라이언트가 요청한 Host 값을 뜻합니다.
            # 원래 요청한 Host 값을 백엔드에 그대로 전달합니다.
            proxy_set_header Host $host;
            # `$remote_addr`는 Nginx 내장 변수로, 직접 연결된 클라이언트 IP를 뜻합니다.
            # 실제 클라이언트 IP 주소를 백엔드에 전달합니다.
            proxy_set_header X-Real-IP $remote_addr;
            # `$proxy_add_x_forwarded_for`는 Nginx 내장 변수로, 기존 X-Forwarded-For에 현재 클라이언트 IP를 덧붙인 값입니다.
            # 프록시를 거쳐온 IP 목록을 이어 붙여 백엔드에 전달합니다.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # `$scheme`은 Nginx 내장 변수로, 요청 스킴이 `http`인지 `https`인지 나타냅니다.
            # 원본 요청이 HTTP였는지 HTTPS였는지 백엔드에 알려줍니다.
            proxy_set_header X-Forwarded-Proto $scheme;
            # `$http_upgrade`는 클라이언트가 보낸 `Upgrade` 요청 헤더를 담는 Nginx 내장 변수입니다.
            # WebSocket 등 프로토콜 업그레이드 요청 헤더를 전달합니다.
            proxy_set_header Upgrade $http_upgrade;
            # 업그레이드 연결이 필요할 때 Connection 헤더를 맞춰 전달합니다.
            proxy_set_header Connection "upgrade";
        }
    }
}
