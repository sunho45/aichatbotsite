<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker Compose Practice</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      line-height: 1.6;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    section {
      background: #ffffff;
      border: 1px solid #d9e1ec;
      border-radius: 8px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    code {
      background: #eef2f7;
      border-radius: 4px;
      padding: 2px 6px;
    }

    ul {
      padding-left: 22px;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Docker Compose 실습 서버</h1>
      <p>이 화면이 보이면 nginx 컨테이너가 정상 실행 중입니다.</p>
      <ul>
        <li>웹 컨테이너: <code>web</code></li>
        <li>데이터베이스 컨테이너: <code>db</code></li>
        <li>DB 관리 컨테이너: <code>adminer</code></li>
      </ul>
      <p>Adminer는 <code>http://localhost:8081</code>에서 열 수 있습니다.</p>
    </section>
  </main>
</body>
</html>
